name: Compilar APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generar Gradle Wrapper
        # Al ser código de AI Studio, generamos el ejecutable en el momento
        run: gradle wrapper

      - name: Dar permisos y compilar APK Debug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CajaDiaria-debug-apk
          # Usamos ** para buscar el APK sin importar cómo AI Studio estructuró las carpetas
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
